Define {
       ANALOG_PLAYBACK_PCM	'Analog Playback'
       ANALOG_PLAYBACK_PCM_2	'Multi stream Playback'
       ANALOG_CAPTURE_PCM	'Analog Capture'
       ANALOG_CAPTURE_PCM_2	'Multi stream Capture'
       HDA_ANALOG_DAI_NAME      'Analog Playback and Capture'
}

Object.Dai {
	HDA.0 {
		name $HDA_ANALOG_DAI_NAME
		id 4
		default_hw_conf_id 4
		Object.Base.hw_config.HDA0 {}
		direction duplex
	}
}
Object.Pipeline {
	mixout-gain-dai-copier-playback.0 {
		index 2

		Object.Widget.copier.1 {
			stream_name $HDA_ANALOG_DAI_NAME
			dai_type "HDA"
			copier_type "HDA"
		}
		Object.Widget.gain.1 {
			Object.Control.mixer.1 {
				name '2 Main Playback Volume'
			}
		}
	}

	host-copier-gain-mixin-playback.0 {
		index 1

		Object.Widget.copier.1 {
			stream_name $ANALOG_PLAYBACK_PCM
		}

		Object.Widget.gain.1 {
			Object.Control.mixer.1 {
				name '1 2nd Playback Volume'
			}
		}
	}

	host-copier-gain-mixin-playback.1 {
		index 15

		Object.Widget.copier.1 {
			stream_name $ANALOG_PLAYBACK_PCM_2
		}

		Object.Widget.gain.1 {
			Object.Control.mixer.1 {
				name '6 2nd Playback Volume'
			}
		}

		format s32le
	}

	passthrough-capture.0 {
		index 3

		Object.Widget.copier.1 {
			stream_name $ANALOG_CAPTURE_PCM
		}

	}

	passthrough-be.0 {
		index 4
		direction	capture

		Object.Widget.copier.1 {
			dai_index 0
			stream_name $HDA_ANALOG_DAI_NAME
			dai_type "HDA"
			copier_type "HDA"
			type dai_out
			node_type $HDA_LINK_INPUT_CLASS
		}

		format s32le
	}

	passthrough-capture.1 {
		index 13

		Object.Widget.copier.1 {
			stream_name $ANALOG_CAPTURE_PCM_2
		}
	}

}
Object.PCM {
	pcm.0 {
		id 0
		name 'HDA Analog'
		Object.Base.fe_dai.'HDA Analog' {}
		Object.PCM.pcm_caps.playback {
			name $ANALOG_PLAYBACK_PCM
			formats 'S32_LE,S24_LE,S16_LE'
		}
		Object.PCM.pcm_caps.capture {
			name $ANALOG_CAPTURE_PCM
			formats 'S32_LE,S24_LE,S16_LE'
		}
		direction duplex
	}
	pcm.98 {
		id 98
		name 'Multi stream Capture'
		Object.Base.fe_dai.'Multi stream Capture' {}
		Object.PCM.pcm_caps.capture {
			name $ANALOG_CAPTURE_PCM_2
			formats 'S32_LE,S24_LE,S16_LE'
		}
		direction capture
	}
	pcm.99 {
		id 99
		name 'HDA Playback'
		Object.Base.fe_dai.'HDA Playback' {}
		Object.PCM.pcm_caps.playback {
			name $ANALOG_PLAYBACK_PCM_2
			formats 'S32_LE,S24_LE,S16_LE'
		}
		direction playback
	}
}

# top-level pipeline connections
Object.Base {
	route.1 {
		source 'gain.2.1'
		sink 'copier.HDA.2.1'
	}
	route.2 {
		source 'mixin.1.1'
		sink 'mixout.2.1'
	}
	route.5 {
		source 'mixin.15.1'
		sink 'mixout.2.1'
	}
	route.4 {
		source 'copier.HDA.4.1'
		sink 'copier.host.3.1'
	}
	route.6 {
		source 'copier.HDA.4.1'
		sink 'copier.host.13.1'
	}
}
