Object.Dai {
	HDA.0 {
		name 'Analog Playback and Capture'
		id 4
		default_hw_conf_id 4
		Object.Base.hw_config.HDA0 {}
		direction duplex
	}
}
Object.Pipeline {
	mixout-playback.0 {
		index 2
		Object.Widget.pipeline.1 {
			stream_name 'copier.HDA.2.1'
		}

		Object.Widget.copier.1 {
			stream_name 'Analog Playback and Capture'
			dai_type "HDA"
			copier_type "HDA"
		}
		Object.Widget.gain.1 {
			Object.Control.mixer.1 {
				name '2 Main Playback Volume'
			}
		}

		format s32le
	}

	mixin-playback.0 {
		index 1
		Object.Widget.pipeline.1 {
			stream_name 'copier.HDA.2.1'
		}
		Object.Widget.copier.1 {
			stream_name 'Analog Playback'
		}

		Object.Widget.gain.1 {
			Object.Control.mixer.1 {
				name '1 2nd Playback Volume'
			}
		}

		format s32le
	}

	passthrough-capture.0 {
		index 3
		Object.Widget.pipeline.1 {
			stream_name 'copier.HDA.4.1'
		}
		Object.Widget.copier.1 {
			stream_name 'Analog Capture'
		}

		format s32le
	}

	passthrough-be.0 {
		index 4
		Object.Widget.pipeline.1 {
			stream_name 'copier.HDA.4.1'
		}

		Object.Widget.copier.1 {
			dai_index       0
			type            dai_out
			stream_name 'Analog Playback and Capture'
			dai_type "HDA"
			copier_type "HDA"
			node_type       $HDA_LINK_INPUT_CLASS
			Object.Base.audio_format.1 {
				in_bit_depth            32
                                in_valid_bit_depth      32
                                out_bit_depth           32
                                out_valid_bit_depth     32
				dma_buffer_size "$[$ibs * 2]"
			}
		}

		format s32le
	}
}
Object.PCM {
	pcm.0 {
		id 0
		name 'HDA Analog'
		Object.Base.fe_dai.'HDA Analog' {}
		Object.PCM.pcm_caps.playback {
			name 'Analog Playback'
			formats 'S32_LE,S24_LE,S16_LE'
		}
		Object.PCM.pcm_caps.capture {
			name 'Analog Capture'
			formats 'S32_LE,S24_LE,S16_LE'
		}
		direction duplex
	}
}

# top-level pipeline connections
Object.Base {
	route.1 {
		sink 'copier.HDA.2.1'
		source 'gain.2.1'
	}
	route.2 {
		source 'mixin.1.1'
		sink 'mixout.2.1'
	}
	route.3 {
		source 'copier.HDA.4.1'
		sink 'copier.host.3.1'
	}
}
