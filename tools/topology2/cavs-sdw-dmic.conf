#
# SOF TGL ALH DMC
#
#
# PCM 0 -> buffer1.0 -> volume1.0 -> buffer1.1 -> ALH Pin2
# PCM 1 <- buffer2.0 <- volume2.0 <- buffer2.1 <- ALH Pin3
# PCM 2 <-> copier.host.N.0 <-> copier.DMIC.0.M <-> DMIC0

<include/common/tokens.conf>
<include/platform/intel/bxt.conf>
<include/pipelines/cavs/pipeline-passthrough-playback.conf>
<include/pipelines/cavs/pipeline-passthrough-capture.conf>
<include/common/connection.conf>
<include/common/endpoint.conf>
<include/components/dai.conf>
<include/dais/alh.conf>
<include/dais/dmic.conf>

#
# Pipeline definitions
#
# Pipeline ID:1 PCM ID: 0
Object.pipeline-passthrough-playback."1.0" {
	pcm_name		"Jack Out"
	format			"s32le"
	channels		2
	rate			48000
}

# Pipeline ID:2 PCM ID: 1
Object.pipeline-passthrough-capture."2.1" {
	pcm_name		"Jack in"
	format			"s32le"
	channels		2
	rate			48000
}

Object.pipeline-passthrough-capture."3.2" {
	pcm_name	"dmic48k"
	format		"s16le"
	channels	2
	rate		48000
}

#
# List of all DAIs
#
#ALH Index: 2, Direction: playback
Object.ALH."2.2.playback" {
	dai_name		"SDW0-Playback"
	id 			0
	default_hw_config	0
	format			"s24le"
	rate			48000
	ch			2
	hw_config."0" {}

	#include DAI components
	<include/dais/pipe-copier-playback.conf>
}

#ALH Index: 3, Direction: capture
Object.ALH."3.3.capture" {
	dai_name		"SDW0-Capture"
	id 			1
	default_hw_config	1
	format			"s24le"
	rate			48000
	ch			2
	hw_config."1" {}

	#include DAI components
	<include/dais/pipe-copier-capture.conf>
}

#DMIC Index: 0, Direction: duplex

Object.DMIC."1.0.capture" {
	dai_name		"dmic01"
	id 			2
	format			"s16le"
	driver_version		1
	clk_min			500000
	clk_max			4800000
	duty_min		40
	duty_max		60
	sample_rate		48000
	fifo_word_length	32
	unmute_ramp_time_ms	200
	num_pdm_active		1

	hw_config."0" {
		clk_min		500000
		clk_max		4800000
		duty_min	40
		duty_max	60
	}

	<include/dais/pipe-copier-capture.conf>
}

#
# List of all endpoint connections
#
# Connect: Pipeline 1 -> ALH 2 DAI_IN
Object.connection."endpoint.1.0" {
	source "endpoint.sink.pipeline.1.0"
	sink "endpoint.source.ALH.2.0"
}

# Connect: ALH 3 DAI_OUT -> Pipeline 2
Object.connection."endpoint.2.0" {
	sink "endpoint.source.pipeline.2.0"
	source "endpoint.sink.ALH.3.0"
}

Object.connection."endpoint.3.0" {
	sink "endpoint.source.pipeline.3.0"
	source "endpoint.sink.DMIC.1.0"
}

#add abi
<include/common/data.conf>
<include/common/manifest.conf>
<abi-generated.conf>
